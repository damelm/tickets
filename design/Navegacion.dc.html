<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; }
    * { box-sizing: border-box; }
    ::placeholder { color: #9ca3af; }
  </style>
</helmet>

<!-- Top Navigation -->
<div style="background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;">
  <div style="display: flex; align-items: center; gap: 16px;">
    <div style="font-weight: 600; font-size: 18px; color: #111827;">TicketHub</div>
  </div>
  <div style="display: flex; align-items: center; gap: 12px;">
    <div style="position: relative;">
      <input type="text" placeholder="Buscar..." style="padding: 8px 12px 8px 36px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; width: 240px; background: #fff;">
      <svg style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #9ca3af;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 600;">MG</div>
      <svg style="width: 14px; height: 14px; color: #9ca3af;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
    </div>
  </div>
</div>

<div style="display: flex; height: calc(100vh - 57px);">

  <!-- Left sidebar -->
  <div style="width: 240px; background: #fff; border-right: 1px solid #e5e7eb; padding: 20px 14px; flex-shrink: 0;">

    <div style="font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; padding: 0 10px; margin-bottom: 8px;">Empleado</div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; background: #eef2ff; color: #4338ca; font-size: 14px; font-weight: 600; margin-bottom: 2px;">
      <svg style="width: 17px; height: 17px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h7v9H3V3zm11 0h7v5h-7V3zM3 16h7v5H3v-5zm11-3h7v8h-7v-8z" /></svg>
      Dashboard
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: #6b7280; font-size: 14px; margin-bottom: 2px;">
      <svg style="width: 17px; height: 17px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
      Mis tickets
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: #6b7280; font-size: 14px; margin-bottom: 18px;">
      <svg style="width: 17px; height: 17px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
      Crear ticket
    </div>

    <div style="font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; padding: 0 10px; margin-bottom: 8px;">Agente</div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: #6b7280; font-size: 14px; margin-bottom: 2px;">
      <svg style="width: 17px; height: 17px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>
      Todos los tickets
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: #6b7280; font-size: 14px; margin-bottom: 18px;">
      <svg style="width: 17px; height: 17px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h5v18H3V3zm7 6h5v12h-5V9zm7-4h4v16h-4V5z" /></svg>
      Kanban
    </div>

    <div style="font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; padding: 0 10px; margin-bottom: 8px;">Admin</div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: #6b7280; font-size: 14px; margin-bottom: 2px;">
      <svg style="width: 17px; height: 17px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
      Usuarios
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: #6b7280; font-size: 14px; margin-bottom: 2px;">
      <svg style="width: 17px; height: 17px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1m-1 4h1m4-4h1m-1 4h1M9 21v-4h6v4" /></svg>
      Departamentos
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: #6b7280; font-size: 14px;">
      <svg style="width: 17px; height: 17px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317a1.724 1.724 0 012.573-1.066c.943.557 2.06-.56 1.503-1.503a1.724 1.724 0 011.066-2.573M12 15a3 3 0 100-6 3 3 0 000 6z" /></svg>
      Configuración
    </div>
  </div>

  <!-- Content placeholder -->
  <div style="flex: 1; display: flex; align-items: center; justify-content: center;">
    <div style="text-align: center; color: #d1d5db;">
      <svg style="width: 40px; height: 40px; margin-bottom: 8px;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16" /></svg>
      <div style="font-size: 13px;">El contenido de cada vista va acá</div>
    </div>
  </div>

</div>

</x-dc>
</body>
</html>
